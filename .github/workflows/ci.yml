name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  architecture-checks:
    # Phase 6.A (design-review.md section 7): regression guard for two
    # properties that already hold on this tree -- public headers must not
    # transitively depend on backend-specific code, and "common" report
    # logic must not contain backend conditionals. Fast and build-free, so
    # it runs on every push/PR without waiting on a full matrix build.
    name: architecture checks (public/backend dependency leakage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 6.A architecture checks
        run: python3 Scripts/check_architecture.py

  build-test:
    name: ${{ matrix.os }} ${{ matrix.backend }} ${{ matrix.gpu }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [KINETO, ITT]
        gpu: [none]
        include:
          # Pinned to windows-2022 (not windows-latest): CUDA 12.8.1's
          # cudafe++ preprocessor segfaults (0xC0000005) parsing headers
          # under the newer MSVC toolset windows-latest currently defaults
          # to -- not just a version-check rejection that
          # -allow-unsupported-compiler could paper over, a real parser
          # crash. windows-2022 still ships the VS2022 toolset CUDA 12.8 was
          # validated against.
          - os: windows-2022
            backend: KINETO
            gpu: cuda
          - os: windows-2022
            backend: ITT
            gpu: cuda

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Show toolchain
        shell: bash
        run: |
          cmake --version
          python3 --version

      - name: Install CUDA Toolkit
        if: matrix.gpu == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc","cudart","cupti","nvtx","visual_studio_integration"]'
          use-github-cache: false

      - name: Initialize MSVC
        if: matrix.gpu == 'cuda'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [[ "${{ matrix.gpu }}" == "cuda" ]]; then
            # Ninja avoids CMake's Visual Studio CUDA-toolset discovery path
            # (see the CUDA CI fix history), but it must stay scoped to CUDA
            # jobs: on windows-latest, Ninja with no compiler specified picks
            # up the runner's bundled MinGW GCC instead of MSVC, which is a
            # different toolchain than the non-CUDA Windows jobs are meant to
            # exercise and has already broken a link (gethostname) and a test
            # (heap corruption) that pass fine under MSVC.
            extra+=(
              --generator Ninja
              --require-cuda=ON
              --require-nvtx=ON
              --cuda-architectures=75
              # CUDA 12.8.1 rejects MSVC toolsets newer than it shipped
              # against (github's windows-latest image has since moved to a
              # newer Visual Studio release) with a hard host_config.h
              # version-check error. This must be set on the initial
              # configure invocation, not added later, since
              # enable_language(CUDA)'s compiler-id probe reads
              # CMAKE_CUDA_FLAGS immediately.
              --allow-unsupported-cuda-compiler=on
            )
            if [[ -n "${CUDA_PATH:-}" ]]; then
              extra+=(
                "--cuda-toolkit-root=${CUDA_PATH}"
                "--cuda-compiler=${CUDA_PATH}/bin/nvcc.exe"
              )
              export PATH="${CUDA_PATH}/bin:${CUDA_PATH}/extras/CUPTI/lib64:${PATH}"
            fi
          fi
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build \
            --build-type=Release \
            --backend=${{ matrix.backend }} \
            --gpu-backend=${{ matrix.gpu }} \
            --testing=ON \
            --examples=ON \
            "${extra[@]}"

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release --parallel=4

      - name: Test
        env:
          # Phase 6.D (design-review.md section 7, Phase 6): write GoogleTest's
          # own per-case JUnit XML (skip vs. pass, not just ctest's one
          # pass/fail bit for the whole binary) so the next step can tell "ran
          # on real hardware" apart from "skipped everywhere" without a human
          # reading the log. Harmless on legs that don't compile
          # TestProfilerGpuRealHardware.cpp (PROFILER_HAS_CUDA=0) -- the next
          # step only looks for it on the CUDA legs.
          GTEST_OUTPUT: xml:${{ github.workspace }}/gtest-results.xml
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release --test-timeout 180

      - name: Report GpuRealHardware real-hardware status
        if: matrix.gpu == 'cuda'
        shell: bash
        run: python3 Scripts/report_gpu_test_status.py "${{ github.workspace }}/gtest-results.xml"

      - name: Set up Python for HTA example
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'KINETO'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate HTA example
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'KINETO'
        shell: bash
        run: |
          python -m pip install -r examples/requirements-hta.txt
          ./build/bin/example_hta build/hta-traces
          python examples/analyze_hta.py build/hta-traces --output build/hta-results

      - name: Install and consume
        if: matrix.backend == 'KINETO' && matrix.gpu == 'none'
        shell: bash
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" install --build-dir build --build-type Release --install-prefix "${GITHUB_WORKSPACE}/install"
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir consumer --build-dir build-consumer \
            --prefix-path="${GITHUB_WORKSPACE}/install"
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-consumer --build-type Release --parallel=4
          export PATH="${GITHUB_WORKSPACE}/install/bin:${GITHUB_WORKSPACE}/install/lib:${PATH}"
          export DYLD_LIBRARY_PATH="${GITHUB_WORKSPACE}/install/lib:${DYLD_LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/install/lib:${LD_LIBRARY_PATH:-}"
          if [[ -x ./build-consumer/profiler_consumer ]]; then
            ./build-consumer/profiler_consumer
          else
            ./build-consumer/Release/profiler_consumer.exe
          fi

  hip-toolkit-only:
    # Phase 6.D (design-review.md section 7, Phase 6): "Add a HIP/ROCm CI leg
    # ... compilation-only, explicitly labeled 'toolkit-only, not
    # device-verified'" -- the same honestly-labeled tier build-test's
    # windows-2022 CUDA legs already occupy (they install a real toolkit on a
    # GitHub-hosted runner with no physical GPU, per
    # docs/phase-5-remaining.md's own investigation). No ROCm hardware exists
    # anywhere in this project (same constraint Phase 4/5/6 already
    # documented), so this only proves PROFILER_GPU_BACKEND=hip configures,
    # links against a real ROCm toolkit, and compiles -- not that it runs
    # correctly on a device. Pinned to ubuntu-22.04 (not ubuntu-latest):
    # ROCm's apt repository is published per Ubuntu codename (jammy here),
    # so floating to a newer default would silently point at a
    # not-yet-published repo path.
    name: hip-toolkit-only (compiles, not device-verified)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      # Follows ROCm's own documented apt-repository setup
      # (https://rocm.docs.amd.com, "Ubuntu install"). hip-dev pulls in the
      # hip-config.cmake package CMakeLists.txt's find_package(hip) needs;
      # no GPU driver/runtime package is installed since no device is
      # present on this runner.
      - name: Install ROCm HIP toolkit (compile-only)
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key | \
            gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/latest jammy main" | \
            sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          # hip-dev alone is not enough for CMakeLists.txt's KINETO_BACKEND=rocm
          # path (third_party/kineto/libkineto/CMakeLists.txt requires
          # rocm-core/rocm_version.h and, for ROCm >= 7.0, rocprofiler-sdk).
          # ROCm's apt packaging bundles headers into rocprofiler-sdk itself
          # (no separate -dev split, unlike hip-dev/roctracer-dev).
          # librocprofiler-sdk.so itself needs hsa-amd-aqlprofile's
          # libhsa-amd-aqlprofile64.so at link time (aqlprofile_* symbols) --
          # not pulled in automatically by apt (no declared dependency).
          sudo apt-get install -y hip-dev rocm-core rocprofiler-sdk hsa-amd-aqlprofile

      - name: Configure (HIP, toolkit-only)
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build-hip --build-type=Release \
            --prefix-path=/opt/rocm \
            --rocm-source-dir=/opt/rocm \
            --backend=KINETO \
            --gpu-backend=hip \
            --require-hip=ON \
            --testing=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-hip --build-type Release --parallel=4

      # No HIP-specific real-hardware test exists yet (design-review.md's
      # Phase 4 real-hardware scope was CUDA-only) -- this proves the
      # existing suite still builds and runs (every GPU-gated case skips
      # cleanly, same as the CUDA toolkit-only legs) against a real ROCm
      # toolchain, not HIP capture correctness.
      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-hip --build-type Release --test-timeout 180

  cross-backend-conformance:
    # Phase 6.C (design-review.md section 7, Phase 6 / section 8's "CPU
    # conformance" row): KINETO and ITT are mutually exclusive per build, so
    # this cannot be one in-process parameterized test -- it builds each
    # backend in its own build directory, runs the identical shared golden
    # scenario (Testing/Cxx/TestCrossBackendGoldenScenario.cpp) against
    # each, and diffs the two normalized summaries for exact agreement on
    # event identities/counts (never timing, per section 8's own "avoid
    # brittle" guidance -- see that file's own comment for what is and is
    # not compared and why).
    name: cross-backend-conformance (KINETO vs ITT golden scenario)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Configure and build (KINETO)
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build-golden-kineto --build-type=Release \
            --backend=KINETO --gpu-backend=none \
            --testing=ON
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-golden-kineto --build-type Release --parallel=4

      - name: Run golden scenario (KINETO)
        working-directory: build-golden-kineto/bin
        run: ./ProfilerCxxTests --gtest_filter=CrossBackendGolden.kineto_backend_observes_expected_identities

      - name: Save KINETO summary
        run: cp build-golden-kineto/bin/cross_backend_golden.json kineto_golden.json

      - name: Configure and build (ITT)
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build-golden-itt --build-type=Release \
            --backend=ITT --gpu-backend=none \
            --testing=ON
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-golden-itt --build-type Release --parallel=4

      - name: Run golden scenario (ITT)
        working-directory: build-golden-itt/bin
        run: ./ProfilerCxxTests --gtest_filter=CrossBackendGolden.itt_backend_observes_expected_identities

      - name: Save ITT summary
        run: cp build-golden-itt/bin/cross_backend_golden.json itt_golden.json

      - name: Diff KINETO vs ITT golden-scenario summaries
        run: python3 Scripts/diff_cross_backend_golden.py kineto_golden.json itt_golden.json

  native-only:
    name: native-only build (PROFILER_BACKEND=NONE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      # design-review.md section 7's Phase 3 bullet: "allow a native-only
      # build" -- no Kineto or ITT instrumentation backend compiled in at
      # all, only native CPU collection. The rest of the CI matrix always
      # picks one of KINETO/ITT, so this is the only job that exercises
      # PROFILER_HAS_KINETO=0 && PROFILER_HAS_ITT=0 together.
      - name: Configure (native-only)
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build-none --build-type=Release \
            --backend=NONE \
            --gpu-backend=none \
            --testing=ON \
            --examples=ON

      - name: Build (native-only)
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-none --build-type Release --parallel=4

      - name: Test (native-only)
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-none --build-type Release --test-timeout 180

      # design-review.md section 7's Phase 5 bullet: "verify native-only
      # consumption does not initialize or require GPU/instrumentation
      # backends." Building and testing green is not proof of that by
      # itself: bespoke/base/cuda.cpp (defining impl::cudaStubs()) is only
      # compiled under Kineto/ITT, but a call to it left unguarded by
      # PROFILER_HAS_KINETO/_ITT compiled fine here before -- GNU ld allows
      # undefined symbols in a shared library by default, so this exact
      # class of bug passed this job silently while failing outright on
      # macOS/Windows's stricter linkers (found and fixed going into this
      # check). Fail explicitly instead of relying on linker leniency.
      - name: Verify no GPU/instrumentation symbols leaked into the native-only library
        run: |
          lib=build-none/lib/libProfiler.so
          if [ ! -f "$lib" ]; then
            echo "expected shared library not found: $lib" >&2
            exit 1
          fi
          if nm -D "$lib" 2>/dev/null | grep -iE 'cuda[A-Z]|nvtx(Range|Mark|Domain)|__itt_|libkineto|ActivityTraceWrapper'; then
            echo "native-only (PROFILER_BACKEND=NONE) library references GPU/instrumentation symbols" >&2
            exit 1
          fi

  static-link:
    name: static-link registration survives archive linking (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Phase 5.D (design-review.md section 7): the previous single-leg job
        # only ever exercised PROFILER_BACKEND=KINETO -- ITT's static-install
        # path (installing/referencing libittnotify.a instead of libkineto.a)
        # was never covered by CI. CUDA/HIP static consumption is a separate,
        # still-open gap (needs find_dependency(CUDAToolkit)/hip wiring this
        # phase did not attempt -- see docs/plans/phase-5-api-simplification.md's
        # 5.D amendment) and is not added to this matrix.
        backend: [KINETO, ITT]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      # Several sources (native/gpu/gpu_tracer_factory.cpp, native/cpu/
      # host_tracer_factory.cpp, native/cpu/python_tracer_factory.cpp, and
      # CUDA/ITT stub registration) register purely via a file-scope static
      # initializer with no other
      # symbol referenced elsewhere in the library. The rest of the CI matrix
      # only ever builds BUILD_SHARED_LIBS=ON (the default), where a shared
      # library always links every object file in, so it never exercises the
      # archive-linking path where an unreferenced .o member -- and its
      # registration -- can be silently dropped (docs/design-review.md
      # finding 13; cmake/ProfilerLinking.cmake's whole-archive fix).
      - name: Configure (static)
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build-static --build-type=Release \
            --shared=OFF \
            --backend=${{ matrix.backend }} \
            --gpu-backend=none \
            --testing=ON

      - name: Build (static)
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-static --build-type Release --parallel=4

      # ProfilerCxxTests links against the *in-tree* static Profiler target
      # (not an installed find_package package), which is exactly the archive-
      # linking path profiler_keep_static_registrations(Profiler) protects --
      # this is the real proof that registration survives.
      - name: Test (static)
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-static --build-type Release --test-timeout 180

      # Unlike the SHARED case (where Kineto/fmt are already linked into
      # libProfiler.so and a consumer needs nothing else), a STATIC
      # libProfiler.a resolves none of its own symbols -- ProfilerConfig.cmake
      # now also installs and references Profiler's own third-party static
      # archives (fmt/kineto/ittnotify) so a find_package() consumer gets a
      # working link line. This is the actual previously-broken scenario
      # (reproduced: dozens of undefined-symbol errors for libkineto/fmt
      # symbols before that fix), verified end to end here rather than just
      # in-tree. Scope: PROFILER_GPU_BACKEND=none -- a CUDA/HIP static
      # consumer would additionally need find_dependency(CUDAToolkit)
      # wiring, not covered here.
      - name: Install and consume (static)
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" install --build-dir build-static --build-type Release --install-prefix "${GITHUB_WORKSPACE}/install-static"
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir consumer --build-dir build-consumer-static \
            --prefix-path="${GITHUB_WORKSPACE}/install-static"
          python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-consumer-static --build-type Release --parallel=4
          ./build-consumer-static/profiler_consumer

      # design-review.md section 7's Phase 5 bullet: "publish supported
      # headers only" (finding 13: installation used to copy every header
      # under Profiler/, including native/cpu, native/gpu, native/platform,
      # bespoke/base, bespoke/kineto, bespoke/itt -- implementation detail
      # profiler.h's own doc comment and docs/profiler.md already describe as
      # internal). CMakeLists.txt's install() now installs an explicit list
      # derived from profiler.h's real transitive #include closure. Guard
      # against that list silently drifting from the source of truth in
      # either direction: a header profiler.h needs but the list omits would
      # break external consumers (the "install and consume" step above
      # already exercises this positively); a known-internal directory
      # reappearing would mean the curation regressed.
      - name: Verify installed header surface stays curated
        run: |
          include_dir="${GITHUB_WORKSPACE}/install-static/include"
          for f in profiler.h common/session.h common/capture.h \
                   native/session/profiler.h native/session/profiler_report.h \
                   native/analysis/statistical_analyzer.h native/core/profiler_options.h; do
            if [ ! -f "$include_dir/$f" ]; then
              echo "expected public header missing from install: $f" >&2
              exit 1
            fi
          done
          if find "$include_dir" -path "*/native/cpu/*" -o -path "*/native/gpu/*" \
               -o -path "*/native/platform/*" -o -path "*/native/utils/*" \
               -o -path "*/bespoke/base/*" -o -path "*/bespoke/kineto/*" \
               -o -path "*/bespoke/itt/*" | grep -q .; then
            echo "internal-only headers leaked into the installed include/ tree" >&2
            exit 1
          fi
          count=$(find "$include_dir" -name '*.h' | wc -l | tr -d ' ')
          if [ "$count" -gt 40 ]; then
            echo "installed header count ($count) grew well past the curated ~29 -- check CMakeLists.txt's _profiler_public_headers list is still intentional" >&2
            exit 1
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build-coverage --build-type=Debug \
            --c-compiler=gcc --cxx-compiler=g++ \
            --backend=KINETO \
            --testing=ON \
            --coverage=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-coverage --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-coverage --test-timeout 180

      - name: Capture coverage
        run: coverage-tool --build=build-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage_report/html/
          retention-days: 30

  benchmark:
    name: benchmark (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize benchmark dependencies
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

          test -f third_party/benchmark/CMakeLists.txt || {
            echo "Google Benchmark submodule is missing"
            git submodule status --recursive
            exit 1
          }

      # Phase 0's reference-workload/budget-gated overhead measurement
      # (design-review.md section 1.1), see docs/benchmarking.md. This job
      # is informational only: a shared GitHub-hosted runner is not the
      # dedicated, low-noise "reference machine" design-review.md requires
      # to gate pass/fail against the 1%/3%/5% overhead targets, so it never
      # fails the build on the reported numbers -- only on a crash/nonzero
      # exit. Real budget gating needs a run on a controlled machine.
      - name: Configure
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build-benchmark --build-type=Release \
            --backend=KINETO \
            --benchmark=ON \
            --testing=OFF

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-benchmark --build-type Release --parallel=4

      - name: Run
        run: ./build-benchmark/bin/profiler_benchmark | tee benchmark-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.txt
          retention-days: 30

  sanitize-asan-ubsan:
    name: sanitize-asan-ubsan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # detect_leaks=1 hangs at exit on macOS: LeakSanitizer's stop-the-world
      # scan is not reliably supported on Darwin, so it stays Linux-only.
      # LeakSanitizer is supported on the Linux runner and catches actual
      # unreleased allocations. macOS keeps it disabled because its
      # stop-the-world scan can hang during process teardown.
      ASAN_OPTIONS: detect_leaks=${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Configure
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build-asan --build-type=RelWithDebInfo \
            --backend=KINETO \
            --testing=ON \
            --sanitizer-types=address,undefined

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-asan --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-asan --test-timeout 180

  sanitize-tsan:
    name: sanitize-tsan
    # Linux-only: ThreadSanitizer's macOS support has historically been the
    # least mature of the sanitizers and has shown toolchain-specific crashes
    # during its own runtime initialization (before any Profiler code runs)
    # unrelated to this project. Linux/glibc TSan is mature and reliable.
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Configure
        run: |
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build-tsan --build-type=RelWithDebInfo \
            --backend=KINETO \
            --testing=ON \
            --sanitizer-types=thread

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build-tsan --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build-tsan --test-timeout 180

  cache-icecc:
    # Exercises PROFILER_ENABLE_CACHE/PROFILER_CACHE_BACKEND and
    # PROFILER_ENABLE_ICECC (cmake/cache.cmake, cmake/helper_macros.cmake)
    # across all three OSes. Native-only backend (PROFILER_BACKEND=NONE)
    # keeps each leg fast -- this job is about proving the launcher wiring
    # configures/builds cleanly, not about re-running the KINETO/ITT matrix.
    # Icecc has no Windows port, so it is exercised on Linux/macOS only.
    name: cache-icecc (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ccache
            os: ubuntu-latest
            backend: ccache
          - name: linux-sccache
            os: ubuntu-latest
            backend: sccache
          - name: linux-icecc
            os: ubuntu-latest
            icecc: true
          - name: macos-ccache
            os: macos-latest
            backend: ccache
          - name: macos-sccache
            os: macos-latest
            backend: sccache
          - name: macos-icecc
            os: macos-latest
            icecc: true
          - name: windows-ccache
            os: windows-latest
            backend: ccache
          - name: windows-sccache
            os: windows-latest
            backend: sccache
          - name: linux-buildcache
            os: ubuntu-latest
            backend: buildcache
          - name: macos-buildcache
            os: macos-latest
            backend: buildcache
          - name: windows-buildcache
            os: windows-latest
            backend: buildcache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Install ccache/icecc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache icecc

      - name: Install ccache/icecream (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache icecream

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ccache

      - name: Set up sccache
        if: matrix.backend == 'sccache'
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.12.0
          disable_annotations: 'true'

      - name: Set BuildCache directory
        if: matrix.backend == 'buildcache'
        shell: bash
        run: echo "BUILDCACHE_DIR=$RUNNER_TEMP/buildcache-data" >> "$GITHUB_ENV"

      - name: Install BuildCache
        if: matrix.backend == 'buildcache'
        shell: bash
        run: python3 .github/scripts/install_buildcache.py --install-prefix "$RUNNER_TEMP/buildcache-tool"

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [[ -n "${{ matrix.backend }}" ]]; then
            extra+=(--cache=ON --cache-backend=${{ matrix.backend }})
          fi
          if [[ "${{ matrix.icecc }}" == "true" ]]; then
            extra+=(--icecc=ON)
          fi
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build \
            --build-type=Release \
            --backend=NONE \
            --gpu-backend=none \
            --testing=ON \
            "${extra[@]}"

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release --parallel=4

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release --test-timeout 180
