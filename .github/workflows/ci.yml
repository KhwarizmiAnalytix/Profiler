name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }} ${{ matrix.backend }} ${{ matrix.gpu }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [KINETO, ITT]
        gpu: [none]
        include:
          # Pinned to windows-2022 (not windows-latest): CUDA 12.8.1's
          # cudafe++ preprocessor segfaults (0xC0000005) parsing headers
          # under the newer MSVC toolset windows-latest currently defaults
          # to -- not just a version-check rejection that
          # -allow-unsupported-compiler could paper over, a real parser
          # crash. windows-2022 still ships the VS2022 toolset CUDA 12.8 was
          # validated against.
          - os: windows-2022
            backend: KINETO
            gpu: cuda
          - os: windows-2022
            backend: ITT
            gpu: cuda

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Show toolchain
        shell: bash
        run: |
          cmake --version
          python3 --version

      - name: Install CUDA Toolkit
        if: matrix.gpu == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc","cudart","cupti","nvtx","visual_studio_integration"]'
          use-github-cache: false

      - name: Initialize MSVC
        if: matrix.gpu == 'cuda'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [[ "${{ matrix.gpu }}" == "cuda" ]]; then
            # Ninja avoids CMake's Visual Studio CUDA-toolset discovery path
            # (see the CUDA CI fix history), but it must stay scoped to CUDA
            # jobs: on windows-latest, Ninja with no compiler specified picks
            # up the runner's bundled MinGW GCC instead of MSVC, which is a
            # different toolchain than the non-CUDA Windows jobs are meant to
            # exercise and has already broken a link (gethostname) and a test
            # (heap corruption) that pass fine under MSVC.
            extra+=(
              -G Ninja
              -DPROFILER_REQUIRE_CUDA=ON
              -DPROFILER_REQUIRE_NVTX=ON
              -DCMAKE_CUDA_ARCHITECTURES=75
              # CUDA 12.8.1 rejects MSVC toolsets newer than it shipped
              # against (github's windows-latest image has since moved to a
              # newer Visual Studio release) with a hard host_config.h
              # version-check error. This must be set on the initial
              # configure invocation, not added later, since
              # enable_language(CUDA)'s compiler-id probe reads
              # CMAKE_CUDA_FLAGS immediately.
              -DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler
            )
            if [[ -n "${CUDA_PATH:-}" ]]; then
              extra+=(
                "-DCUDAToolkit_ROOT=${CUDA_PATH}"
                "-DCMAKE_CUDA_COMPILER=${CUDA_PATH}/bin/nvcc.exe"
              )
              export PATH="${CUDA_PATH}/bin:${CUDA_PATH}/extras/CUPTI/lib64:${PATH}"
            fi
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPROFILER_BACKEND=${{ matrix.backend }} \
            -DPROFILER_GPU_BACKEND=${{ matrix.gpu }} \
            -DPROFILER_ENABLE_TESTING=ON \
            -DPROFILER_ENABLE_EXAMPLES=ON \
            "${extra[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 180

      - name: Set up Python for HTA example
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'KINETO'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate HTA example
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'KINETO'
        shell: bash
        run: |
          python -m pip install -r examples/requirements-hta.txt
          ./build/bin/example_hta build/hta-traces
          python examples/analyze_hta.py build/hta-traces --output build/hta-results

      - name: Install and consume
        if: matrix.backend == 'KINETO' && matrix.gpu == 'none'
        shell: bash
        run: |
          cmake --install build --config Release --prefix "${GITHUB_WORKSPACE}/install"
          cmake -S consumer -B build-consumer \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/install"
          cmake --build build-consumer --config Release --parallel
          export PATH="${GITHUB_WORKSPACE}/install/bin:${GITHUB_WORKSPACE}/install/lib:${PATH}"
          export DYLD_LIBRARY_PATH="${GITHUB_WORKSPACE}/install/lib:${DYLD_LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/install/lib:${LD_LIBRARY_PATH:-}"
          if [[ -x ./build-consumer/profiler_consumer ]]; then
            ./build-consumer/profiler_consumer
          else
            ./build-consumer/Release/profiler_consumer.exe
          fi

  native-only:
    name: native-only build (PROFILER_BACKEND=NONE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      # design-review.md section 7's Phase 3 bullet: "allow a native-only
      # build" -- no Kineto or ITT instrumentation backend compiled in at
      # all, only native CPU collection. The rest of the CI matrix always
      # picks one of KINETO/ITT, so this is the only job that exercises
      # PROFILER_HAS_KINETO=0 && PROFILER_HAS_ITT=0 together.
      - name: Configure (native-only)
        run: |
          cmake -S . -B build-none -DCMAKE_BUILD_TYPE=Release \
            -DPROFILER_BACKEND=NONE \
            -DPROFILER_GPU_BACKEND=none \
            -DPROFILER_ENABLE_TESTING=ON \
            -DPROFILER_ENABLE_EXAMPLES=ON

      - name: Build (native-only)
        run: cmake --build build-none --config Release --parallel

      - name: Test (native-only)
        run: ctest --test-dir build-none -C Release --output-on-failure --timeout 180

      # design-review.md section 7's Phase 5 bullet: "verify native-only
      # consumption does not initialize or require GPU/instrumentation
      # backends." Building and testing green is not proof of that by
      # itself: bespoke/base/cuda.cpp (defining impl::cudaStubs()) is only
      # compiled under Kineto/ITT, but a call to it left unguarded by
      # PROFILER_HAS_KINETO/_ITT compiled fine here before -- GNU ld allows
      # undefined symbols in a shared library by default, so this exact
      # class of bug passed this job silently while failing outright on
      # macOS/Windows's stricter linkers (found and fixed going into this
      # check). Fail explicitly instead of relying on linker leniency.
      - name: Verify no GPU/instrumentation symbols leaked into the native-only library
        run: |
          lib=build-none/lib/libProfiler.so
          if [ ! -f "$lib" ]; then
            echo "expected shared library not found: $lib" >&2
            exit 1
          fi
          if nm -D "$lib" 2>/dev/null | grep -iE 'cuda[A-Z]|nvtx(Range|Mark|Domain)|__itt_|libkineto|ActivityTraceWrapper'; then
            echo "native-only (PROFILER_BACKEND=NONE) library references GPU/instrumentation symbols" >&2
            exit 1
          fi

  static-link:
    name: static-link registration survives archive linking (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Phase 5.D (design-review.md section 7): the previous single-leg job
        # only ever exercised PROFILER_BACKEND=KINETO -- ITT's static-install
        # path (installing/referencing libittnotify.a instead of libkineto.a)
        # was never covered by CI. CUDA/HIP static consumption is a separate,
        # still-open gap (needs find_dependency(CUDAToolkit)/hip wiring this
        # phase did not attempt -- see docs/plans/phase-5-api-simplification.md's
        # 5.D amendment) and is not added to this matrix.
        backend: [KINETO, ITT]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      # Several sources (native/gpu/gpu_tracer_factory.cpp, native/cpu/
      # host_tracer_factory.cpp, native/cpu/python_tracer_factory.cpp, and
      # CUDA/ITT stub registration) register purely via a file-scope static
      # initializer with no other
      # symbol referenced elsewhere in the library. The rest of the CI matrix
      # only ever builds BUILD_SHARED_LIBS=ON (the default), where a shared
      # library always links every object file in, so it never exercises the
      # archive-linking path where an unreferenced .o member -- and its
      # registration -- can be silently dropped (docs/design-review.md
      # finding 13; cmake/ProfilerLinking.cmake's whole-archive fix).
      - name: Configure (static)
        run: |
          cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DPROFILER_BACKEND=${{ matrix.backend }} \
            -DPROFILER_GPU_BACKEND=none \
            -DPROFILER_ENABLE_TESTING=ON

      - name: Build (static)
        run: cmake --build build-static --config Release --parallel

      # ProfilerCxxTests links against the *in-tree* static Profiler target
      # (not an installed find_package package), which is exactly the archive-
      # linking path profiler_keep_static_registrations(Profiler) protects --
      # this is the real proof that registration survives.
      - name: Test (static)
        run: ctest --test-dir build-static -C Release --output-on-failure --timeout 180

      # Unlike the SHARED case (where Kineto/fmt are already linked into
      # libProfiler.so and a consumer needs nothing else), a STATIC
      # libProfiler.a resolves none of its own symbols -- ProfilerConfig.cmake
      # now also installs and references Profiler's own third-party static
      # archives (fmt/kineto/ittnotify) so a find_package() consumer gets a
      # working link line. This is the actual previously-broken scenario
      # (reproduced: dozens of undefined-symbol errors for libkineto/fmt
      # symbols before that fix), verified end to end here rather than just
      # in-tree. Scope: PROFILER_GPU_BACKEND=none -- a CUDA/HIP static
      # consumer would additionally need find_dependency(CUDAToolkit)
      # wiring, not covered here.
      - name: Install and consume (static)
        run: |
          cmake --install build-static --config Release --prefix "${GITHUB_WORKSPACE}/install-static"
          cmake -S consumer -B build-consumer-static \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/install-static"
          cmake --build build-consumer-static --config Release --parallel
          ./build-consumer-static/profiler_consumer

      # design-review.md section 7's Phase 5 bullet: "publish supported
      # headers only" (finding 13: installation used to copy every header
      # under Profiler/, including native/cpu, native/gpu, native/platform,
      # bespoke/base, bespoke/kineto, bespoke/itt -- implementation detail
      # profiler.h's own doc comment and docs/profiler.md already describe as
      # internal). CMakeLists.txt's install() now installs an explicit list
      # derived from profiler.h's real transitive #include closure. Guard
      # against that list silently drifting from the source of truth in
      # either direction: a header profiler.h needs but the list omits would
      # break external consumers (the "install and consume" step above
      # already exercises this positively); a known-internal directory
      # reappearing would mean the curation regressed.
      - name: Verify installed header surface stays curated
        run: |
          include_dir="${GITHUB_WORKSPACE}/install-static/include"
          for f in profiler.h common/session.h common/capture.h \
                   native/session/profiler.h native/session/profiler_report.h \
                   native/analysis/statistical_analyzer.h native/core/profiler_options.h; do
            if [ ! -f "$include_dir/$f" ]; then
              echo "expected public header missing from install: $f" >&2
              exit 1
            fi
          done
          if find "$include_dir" -path "*/native/cpu/*" -o -path "*/native/gpu/*" \
               -o -path "*/native/platform/*" -o -path "*/native/utils/*" \
               -o -path "*/bespoke/base/*" -o -path "*/bespoke/kineto/*" \
               -o -path "*/bespoke/itt/*" | grep -q .; then
            echo "internal-only headers leaked into the installed include/ tree" >&2
            exit 1
          fi
          count=$(find "$include_dir" -name '*.h' | wc -l | tr -d ' ')
          if [ "$count" -gt 40 ]; then
            echo "installed header count ($count) grew well past the curated ~29 -- check CMakeLists.txt's _profiler_public_headers list is still intentional" >&2
            exit 1
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure
        run: |
          cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DPROFILER_BACKEND=KINETO \
            -DPROFILER_ENABLE_TESTING=ON \
            -DPROFILER_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage --parallel

      - name: Test
        run: ctest --test-dir build-coverage --output-on-failure --timeout 180

      - name: Capture coverage
        run: coverage-tool --build=build-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage_report/html/
          retention-days: 30

  benchmark:
    name: benchmark (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize benchmark dependencies
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

          test -f third_party/benchmark/CMakeLists.txt || {
            echo "Google Benchmark submodule is missing"
            git submodule status --recursive
            exit 1
          }

      # Phase 0's reference-workload/budget-gated overhead measurement
      # (design-review.md section 1.1), see docs/benchmarking.md. This job
      # is informational only: a shared GitHub-hosted runner is not the
      # dedicated, low-noise "reference machine" design-review.md requires
      # to gate pass/fail against the 1%/3%/5% overhead targets, so it never
      # fails the build on the reported numbers -- only on a crash/nonzero
      # exit. Real budget gating needs a run on a controlled machine.
      - name: Configure
        run: |
          cmake -S . -B build-benchmark -DCMAKE_BUILD_TYPE=Release \
            -DPROFILER_BACKEND=KINETO \
            -DPROFILER_ENABLE_BENCHMARKS=ON \
            -DPROFILER_ENABLE_TESTING=OFF

      - name: Build
        run: cmake --build build-benchmark --config Release --parallel

      - name: Run
        run: ./build-benchmark/bin/profiler_benchmark | tee benchmark-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.txt
          retention-days: 30

  sanitize-asan-ubsan:
    name: sanitize-asan-ubsan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # detect_leaks=1 hangs at exit on macOS: LeakSanitizer's stop-the-world
      # scan is not reliably supported on Darwin. Kept off on both platforms
      # so the recipe stays identical; enable it in a Linux-only job if leak
      # detection is wanted later.
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Configure
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPROFILER_BACKEND=KINETO \
            -DPROFILER_ENABLE_TESTING=ON \
            -DPROFILER_SANITIZER=address,undefined

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure --timeout 180

  sanitize-tsan:
    name: sanitize-tsan
    # Linux-only: ThreadSanitizer's macOS support has historically been the
    # least mature of the sanitizers and has shown toolchain-specific crashes
    # during its own runtime initialization (before any Profiler code runs)
    # unrelated to this project. Linux/glibc TSan is mature and reliable.
    runs-on: ubuntu-latest
    env:
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Configure
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPROFILER_BACKEND=KINETO \
            -DPROFILER_ENABLE_TESTING=ON \
            -DPROFILER_SANITIZER=thread

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure --timeout 180
