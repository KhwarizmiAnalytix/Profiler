# Host config for coverage-tool
# https://github.com/KhwarizmiAnalytix/coverage-tool

[coverage]
filter = "Profiler"
source_folder = "Profiler"
output_format = "html-and-json"
coverage_report_dir = "coverage_report"
# Profiler builds one flat library (libProfiler.*) + one test executable
# (ProfilerCxxTests). Source lives under Profiler/. The Clang/LLVM backend
# (the default for local dev) needs `modules` to find the real library and
# test binary. The GCC/lcov backend ignores `modules` (it captures the whole
# build directory).
modules = ["Profiler"]

[coverage.exclude]
patterns = [
    # Keep the lcov/gcov report on first-party library sources under
    # Profiler/. Toolchain and vendored trees are captured by gcov because
    # they are inlined into instrumented TUs; they are not Profiler code.
    "*third_party*",
    "*Testing*",
    "/usr/*",
    "*_deps*",
    "/opt/homebrew/*",
    "/opt/llvm/*",
    "/Library/Developer/*",
    "/Applications/Xcode*",
    "*/Cellar/llvm/*",
    "*/include/c++/*",
    "*/c++/v1/*",
]
llvm_ignore_regex = [
    ".*Testing[/\\\\].*",
    ".*third_party[/\\\\].*",
    ".*/opt/homebrew/.*",
    ".*/llvm/.*",
    ".*/c\\+\\+/v1/.*",
    ".*/include/c\\+\\+/.*",
    ".*/Library/Developer/.*",
]

[coverage.gcc]
# coverage-tool's built-in default (mismatch,negative,gcov) is too narrow for
# this codebase's heavily templated/inlined headers: lcov's function-end-line
# derivation hits "inconsistent" errors and "unsupported" warnings on macOS's
# lcov+gcov combination (confirmed with LCOV version 2.5-0) even for a
# Clang-built --coverage binary processed through the lcov/gcov backend.
# docs/profiler.md's own manual lcov recipe already documents this exact
# ignore-list. Scripts/setup.py applies it to every lcov invocation, including
# `lcov --remove` (coverage-tool 2026.9.14 only passes --ignore-errors on
# capture).
lcov_ignore_errors = [
    "inconsistent",
    "unsupported",
    "format",
    "count",
    "unused",
    "corrupt",
    "empty",
    "mismatch",
    "negative",
    "gcov",
]
